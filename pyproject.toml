[project]
name = "archivlotse"
version = "0.1.0"
description = "Konfigurationsgesteuerter KI-Assistent fuer Paperless-ngx"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "wordfreq>=3.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
archivlotse = "archivlotse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["archivlotse*"]

[tool.pytest.ini_options]
pythonpath = ["."]
