# Kopieren nach ai.yaml und anpassen.
#
# 1) Unter "providers" einmal pro Backend die Zugangsdaten eintragen,
#    z.B. ein lokales Ollama und einen Cloud-Dienst wie Scaleway. Die
#    Zugangsdaten stehen hier nur EINMAL pro Provider, auch wenn mehrere
#    Modelle weiter unten denselben Cloud-Dienst benutzen.
#
# 2) Unter "models" jedes benutzte Modell (Schluessel = Modellname, wie
#    ihn der Provider erwartet) mit seinem Provider eintragen. Welcher
#    Schritt welches Modell benutzt, steht in config/steps.yaml
#    ("model:", beim Korrespondenten-Schritt zusaetzlich "model_step2:").

providers:
  ollama_lokal:
    type: ollama
    base_url: "http://127.0.0.1:11434"
    # Wie lange (Sekunden) auf eine Antwort gewartet wird, bevor der
    # Request abbricht - Standard 120s. Lokale Inferenz (CPU, oder ein
    # noch nicht geladenes/"kaltes" Modell) kann deutlich laenger
    # brauchen, deshalb hier optional pro Provider erhoehbar.
    timeout: 300

  scaleway:
    type: scaleway
    # WICHTIG: die Project-ID gehoert als Pfadsegment in die URL, nicht
    # nur ".../v1"! Sonst liefert Scaleway "403 insufficient permissions".
    # Die komplette URL (inkl. deiner Project-ID) zeigt dir die Scaleway-
    # Konsole direkt als Code-Beispiel pro Modell unter "Generative APIs".
    base_url: "https://api.scaleway.ai/<deine-project-id>/v1"
    # API-Schluessel erzeugen/einsehen: https://console.scaleway.com/iam/api-keys
    # Dort stehen "Access Key" und "Secret Key" genau so beschriftet. Fuer
    # die Generative APIs wird nur der Secret Key als Bearer-Token benutzt;
    # die Access Key ID steht hier nur zur eigenen Zuordnung/Referenz.
    access_key_id: "SCWxxxxxxxxxxxxxxxxx"
    secret_key: "${SCALEWAY_SECRET_KEY}"

# price_per_1m_input/output (USD je 1 Million Tokens) sind optional,
# aktivieren aber die Kostenschaetzung im Log und in step_results (siehe
# README "Kosten pro KI-Aufruf"). Fuer ollama-Modelle nicht noetig - lokale
# Anfragen werden immer als $0 gezaehlt.
#
# Gibt es dasselbe Modell bei zwei Providern, bekommt einer der Eintraege
# einen eigenen Schluessel und den echten Modellnamen per "model:", z.B.
#   mistral-small-lokal:
#     provider: ollama_lokal
#     model: "mistral-small3.2:24b"
models:
  "qwen3:4b-instruct":
    provider: ollama_lokal

  mistral-small-3.2-24b-instruct-2506:
    provider: scaleway
    price_per_1m_input: 0.15
    price_per_1m_output: 0.35

  qwen3.8-27b:
    provider: scaleway
    price_per_1m_input: 0.60
    price_per_1m_output: 3.20

  llama-3.3-70b-instruct:
    provider: scaleway
    price_per_1m_input: 0.90
    price_per_1m_output: 0.90
