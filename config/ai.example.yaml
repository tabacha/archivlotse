# Kopieren nach ai.yaml und anpassen.
#
# 1) Unter "providers" einmal pro Backend die Zugangsdaten eintragen,
#    z.B. ein lokales Ollama und einen Cloud-Dienst wie Scaleway. Die
#    Zugangsdaten stehen hier nur EINMAL pro Provider, auch wenn mehrere
#    Rollen weiter unten denselben Cloud-Dienst benutzen.
#
# 2) Unter "roles" pro logischer Aufgabe festlegen, welcher Provider und
#    welches Modell benutzt wird. Jede Rolle wird in config/steps.yaml
#    von genau einem Schritt referenziert (z.B. "title", "document_type").

providers:
  ollama_lokal:
    type: ollama
    base_url: "http://127.0.0.1:11434"

  scaleway:
    type: scaleway
    # WICHTIG: die Project-ID gehoert als Pfadsegment in die URL, nicht
    # nur ".../v1"! Sonst liefert Scaleway "403 insufficient permissions".
    # Die komplette URL (inkl. deiner Project-ID) zeigt dir die Scaleway-
    # Konsole direkt als Code-Beispiel pro Modell unter "Generative APIs".
    base_url: "https://api.scaleway.ai/<deine-project-id>/v1"
    # API-Schluessel erzeugen/einsehen: https://console.scaleway.com/iam/api-keys
    # Dort stehen "Access Key" und "Secret Key" genau so beschriftet. Fuer
    # die Generative APIs wird nur der Secret Key als Bearer-Token benutzt;
    # die Access Key ID steht hier nur zur eigenen Zuordnung/Referenz.
    access_key_id: "SCWxxxxxxxxxxxxxxxxx"
    secret_key: "${SCALEWAY_SECRET_KEY}"

roles:
  title:
    provider: ollama_lokal
    model: "qwen3:4b-instruct"

  # Klassifizierung (ein Label aus einer kurzen Liste waehlen) braucht
  # kein grosses/teures Modell - mistral-small ist auf Scaleway aktuell
  # das guenstigste Modell mit guter Mehrsprachigkeit.
  #
  # price_per_1m_input/output (USD je 1 Million Tokens) sind optional,
  # aktivieren aber die Kostenschaetzung im Log und in step_results
  # (siehe README "Kosten pro KI-Aufruf"). Fuer ollama-Rollen nicht
  # noetig - lokale Anfragen werden immer als $0 gezaehlt.
  document_type:
    provider: scaleway
    model: "mistral-small-3.2-24b-instruct-2506"
    price_per_1m_input: 0.15
    price_per_1m_output: 0.35

  # Mehrfachauswahl (z.B. Tags) ist auch "nur" Klassifizierung - dasselbe
  # guenstige Modell reicht.
  tags:
    provider: scaleway
    model: "mistral-small-3.2-24b-instruct-2506"
    price_per_1m_input: 0.15
    price_per_1m_output: 0.35

  # Beispiel: eine weitere Rolle nutzt denselben Scaleway-Zugang mit einem
  # staerkeren Modell fuer komplexere Aufgaben, ohne den API-Key erneut
  # eintragen zu muessen.
  precise:
    provider: scaleway
    model: "llama-3.3-70b-instruct"
    price_per_1m_input: 0.90
    price_per_1m_output: 0.90

  # Korrespondenten-Erkennung, Stufe 1 (siehe config/steps.yaml:
  # correspondent, TODO_paperless_korrespondenten_pipeline.md): reine
  # Extraktion eines wahrscheinlichen Namens aus dem Text - wie
  # document_type eine einfache Klassifizierungsaufgabe, daher dasselbe
  # guenstige Modell.
  correspondent_step1:
    provider: scaleway
    model: "mistral-small-3.2-24b-instruct-2506"
    price_per_1m_input: 0.15
    price_per_1m_output: 0.35

  # Korrespondenten-Erkennung, Stufe 2: wird NUR bei mehrdeutigen
  # Fuzzy-Treffern aufgerufen (selten), muss dann aber tatsaechlich
  # zwischen mehreren aehnlich klingenden Firmen/Behoerden unterscheiden -
  # daher das staerkere Modell wie "precise".
  correspondent_step2:
    provider: scaleway
    model: "llama-3.3-70b-instruct"
    price_per_1m_input: 0.90
    price_per_1m_output: 0.90
