# Fachliche Pipeline-Konfiguration: pro Verarbeitungsschritt, welches
# Paperless-Feld gelesen wird, welcher Jinja2-Prompt und welche Modellrolle
# (aus config/ai.yaml) benutzt wird, welches Feld mit dem Ergebnis
# beschrieben wird, sowie einfache Vor-/Nachbearbeitung rund um den
# KI-Aufruf. Der Python-Code kennt "title" o.ae. nicht selbst - das steht
# ausschliesslich hier.
#
# Im Unterschied zu config/paperless.yaml und config/ai.yaml enthaelt diese
# Datei keine Zugangsdaten und wird daher direkt mit Git versioniert.

# Reihenfolge, in der "archivlotse process <id>" (ohne --step) die Schritte
# ausfuehrt. Jeder Schritt liest das Dokument frisch aus Paperless, sieht
# also Aenderungen vorheriger Schritte - deshalb document_type vor
# correspondent (nutzt document_type_name im Prompt) und beide vor title
# (title-Prompt nutzt document_type_name UND correspondent_name als
# Kontext). Im --dry-run sieht ein spaeterer Schritt die Aenderung eines
# frueheren Schritts NICHT, da dann nichts tatsaechlich geschrieben wird.
pipeline:
  - ocr_check
  - document_type
  - correspondent
  - tags
  - title

steps:
  # Vorhandenen OCR-Text auf Qualitaet pruefen und bei Bedarf per Docling
  # Serve neu erkennen (force_ocr). Kein KI-Aufruf noetig
  # (quality_check: heuristic), daher auch kein prompt/ai_role.
  # quality_check: ai_judge ist als Alternative vorgesehen, aber noch
  # nicht implementiert.
  ocr_check:
    source_field: content
    target_field: content # gleiches Feld: aktualisiert den Text, falls besser

    quality_check: heuristic
    # Schwelle bewusst konservativ gewaehlt (Heuristik calibriert an
    # echten Dokumenten, siehe archivlotse/ocr_quality.py fuer bekannte
    # Grenzen, z.B. bei zahlenlastigen Dokumenten).
    quality_threshold: 0.50
    # Kuerzere Texte werden nicht geprueft (Heuristik auf wenig Text
    # unzuverlässig).
    min_chars_for_check: 200

    docling:
      base_url: "http://127.0.0.1:5001"
      force_ocr: true

  document_type:
    source_field: content
    target_field: document_type

    prompt: document_type.j2
    ai_role: document_type

    # Die KI muss einen der tatsaechlich in Paperless vorhandenen
    # Dokumenttypen waehlen (per /api/document_types/ geladen) statt
    # freien Text zu erzeugen. Ein Vorschlag, der keinem vorhandenen
    # Dokumenttyp entspricht, wird verworfen statt gespeichert.
    candidates_endpoint: document_types

    preprocessing:
      max_input_chars: 8000

    postprocessing:
      strip_quotes: true
      max_length: 200

  tags:
    source_field: content
    target_field: tags

    prompt: tags.j2
    ai_role: tags

    # Tags sind eine Mehrfachauswahl (ein Dokument kann mehrere haben).
    # Die KI antwortet mit "Hinzufuegen: ..."/"Loeschen: ..." (siehe
    # tags.j2) und darf so auch vorschlagen, einen nicht mehr passenden
    # Tag zu entfernen. Unbekannte Einzelvorschlaege (in beiden Listen)
    # werden nur einzeln verworfen statt den ganzen Schritt abzulehnen.
    candidates_endpoint: tags
    multi: true

    # Diese Tags werden NIE geloescht, unabhaengig davon, was die KI
    # vorschlaegt (Schutz auf Config-Ebene, nicht nur per Prompt-Text).
    protected_candidates:
      - TODO

    preprocessing:
      max_input_chars: 8000

    postprocessing:
      strip_quotes: true
      max_length: 500

  # Zweistufige Korrespondenten-Erkennung, siehe
  # TODO_paperless_korrespondeten_pipeline.md fuer die vollstaendige
  # Herleitung der Schwellenwerte (fuzzy_*_min_* unten, bewusst
  # Beispiel-Startwerte - ggf. an mehr echten Dokumenten nachjustieren).
  # Bekannte Grenze: bei Kontoauszuegen (kein klarer Absender/Empfaenger-
  # Briefkopf) liefert Schritt 1 oft KEINEN-GEFUNDEN statt der
  # ausstellenden Bank - noch nicht behoben.
  correspondent:
    source_field: content
    target_field: correspondent

    # Stufe 1: wahrscheinlichen Namen aus dem Text extrahieren (freier
    # Text, kein Kandidatenabgleich durch die KI selbst).
    prompt: correspondent-step1.j2
    ai_role: correspondent_step1

    # RapidFuzz vergleicht den extrahierten Namen deterministisch mit
    # allen vorhandenen Korrespondenten (/api/correspondents/).
    candidates_endpoint: correspondents

    # Stufe 2: nur bei mehrdeutigem Fuzzy-Ergebnis aufgerufen, mit den
    # paar aehnlichsten Kandidaten zur Disambiguierung.
    prompt_step2: correspondent-step2.j2
    ai_role_step2: correspondent_step2

    # Beispiel-Startwerte (siehe TODO-Datei) - mit echten Dokumenten
    # kalibrieren, bevor automatisch zugeordnet wird:
    fuzzy_assign_min_score: 95.0
    fuzzy_assign_min_gap: 8.0
    fuzzy_review_min_score: 80.0
    fuzzy_candidate_limit: 5

    preprocessing:
      max_input_chars: 8000

    postprocessing:
      strip_quotes: true
      max_length: 200

  title:
    # Paperless-Feld, das als Eingabetext fuer den Prompt gelesen wird.
    source_field: content
    # Paperless-Feld, das mit dem Ergebnis beschrieben wird.
    target_field: title

    prompt: title.j2
    ai_role: title

    preprocessing:
      # Laengerer Eingabetext wird vor dem Rendern des Prompts auf so
      # viele Zeichen gekuerzt.
      max_input_chars: 8000

    postprocessing:
      # Anfuehrungszeichen am Rand der Modellantwort entfernen.
      strip_quotes: true
      # Zur Sicherheit auf maximal so viele Zeichen kuerzen, falls sich
      # das Modell nicht an die Laengenvorgabe im Prompt haelt.
      max_length: 120
