# Fachliche Pipeline-Konfiguration: pro Verarbeitungsschritt, welches
# Paperless-Feld gelesen wird, welcher Jinja2-Prompt und welches Modell
# (Name aus config/ai.yaml: models:) benutzt wird, welches Feld mit dem Ergebnis
# beschrieben wird, sowie einfache Vor-/Nachbearbeitung rund um den
# KI-Aufruf. Der Python-Code kennt "title" o.ae. nicht selbst - das steht
# ausschliesslich hier.
#
# Im Unterschied zu config/paperless.yaml und config/ai.yaml enthaelt diese
# Datei keine Zugangsdaten und wird daher direkt mit Git versioniert.

# Reihenfolge, in der "archivlotse process <id>" (ohne --step) die Schritte
# ausfuehrt. Jeder Schritt liest das Dokument frisch aus Paperless, sieht
# also Aenderungen vorheriger Schritte - deshalb document_type vor
# correspondent (nutzt document_type_name im Prompt) und beide vor title
# (title-Prompt nutzt document_type_name UND correspondent_name als
# Kontext). Im --dry-run sieht ein spaeterer Schritt die Aenderung eines
# frueheren Schritts NICHT, da dann nichts tatsaechlich geschrieben wird.
pipeline:
  - ocr_check
  - document_type
  - correspondent
  - document_date
  - tags
  - title
  - mark_done

steps:
  # Vorhandenen OCR-Text auf Qualitaet pruefen und bei Bedarf per Docling
  # Serve neu erkennen (force_ocr). Kein KI-Aufruf noetig
  # (quality_check: heuristic), daher auch kein prompt/model.
  # quality_check: ai_judge ist als Alternative vorgesehen, aber noch
  # nicht implementiert.
  ocr_check:
    source_field: content
    target_field: content # gleiches Feld: aktualisiert den Text, falls besser

    quality_check: heuristic
    # Schwelle bewusst konservativ gewaehlt (Heuristik calibriert an
    # echten Dokumenten, siehe archivlotse/ocr_quality.py fuer bekannte
    # Grenzen, z.B. bei zahlenlastigen Dokumenten).
    quality_threshold: 0.50
    # Kuerzere Texte werden nicht geprueft (Heuristik auf wenig Text
    # unzuverlässig).
    min_chars_for_check: 200

    docling:
      base_url: "http://127.0.0.1:5001"
      force_ocr: true

  document_type:
    source_field: content
    target_field: document_type

    prompt: document_type.j2
    # Klassifizierung (ein Label aus einer kurzen Liste waehlen) braucht
    # kein grosses/teures Modell - mistral-small ist auf Scaleway aktuell
    # das guenstigste Modell mit guter Mehrsprachigkeit.
    model: "mistral-small-3.2-24b-instruct-2506"

    # Die KI muss einen der tatsaechlich in Paperless vorhandenen
    # Dokumenttypen waehlen (per /api/document_types/ geladen) statt
    # freien Text zu erzeugen. Ein Vorschlag, der keinem vorhandenen
    # Dokumenttyp entspricht, wird verworfen statt gespeichert.
    candidates_endpoint: document_types

    preprocessing:
      max_input_chars: 8000

    postprocessing:
      strip_quotes: true
      max_length: 200

  tags:
    source_field: content
    target_field: tags

    prompt: tags.j2
    model: "qwen3.8-27b"

    # Tags sind eine Mehrfachauswahl (ein Dokument kann mehrere haben).
    # Die KI antwortet mit "Hinzufuegen: ..."/"Loeschen: ..." (siehe
    # tags.j2) und darf so auch vorschlagen, einen nicht mehr passenden
    # Tag zu entfernen. Unbekannte Einzelvorschlaege (in beiden Listen)
    # werden nur einzeln verworfen statt den ganzen Schritt abzulehnen.
    candidates_endpoint: tags
    multi: true

    # Diese Tags werden NIE geloescht, unabhaengig davon, was die KI
    # vorschlaegt (Schutz auf Config-Ebene, nicht nur per Prompt-Text).
    protected_candidates:
      - TODO
      - archivlotse-done

    preprocessing:
      max_input_chars: 8000

    postprocessing:
      strip_quotes: true
      max_length: 500

  # Zweistufige Korrespondenten-Erkennung: Stufe 1 (KI) extrahiert einen
  # Namen, RapidFuzz vergleicht ihn deterministisch mit allen vorhandenen
  # Korrespondenten, Stufe 2 (KI) wird nur bei mehrdeutigem Ergebnis
  # gefragt. Neue Korrespondenten werden nie automatisch angelegt - ein
  # Name ohne passenden Kandidaten wird nur als Vorschlag geloggt.
  # Bekannte Grenze: bei Kontoauszuegen (kein klarer Absender/Empfaenger-
  # Briefkopf) liefert Schritt 1 oft KEINEN-GEFUNDEN statt der
  # ausstellenden Bank - noch nicht behoben.
  correspondent:
    source_field: content
    target_field: correspondent

    # Stufe 1: wahrscheinlichen Namen aus dem Text extrahieren (freier
    # Text, kein Kandidatenabgleich durch die KI selbst) - einfache
    # Extraktion, daher dasselbe guenstige Modell wie document_type.
    prompt: correspondent-step1.j2
    model: "mistral-small-3.2-24b-instruct-2506"

    # RapidFuzz vergleicht den extrahierten Namen deterministisch mit
    # allen vorhandenen Korrespondenten (/api/correspondents/).
    candidates_endpoint: correspondents

    # Stufe 2: nur bei mehrdeutigem Fuzzy-Ergebnis aufgerufen, mit den
    # paar aehnlichsten Kandidaten zur Disambiguierung.
    # Selten aufgerufen, muss dann aber tatsaechlich zwischen mehreren
    # aehnlich klingenden Firmen/Behoerden unterscheiden - daher ein
    # staerkeres Modell.
    prompt_step2: correspondent-step2.j2
    model_step2: "llama-3.3-70b-instruct"

    # Entscheidung nach dem Fuzzy-Abgleich (gap = bester - zweitbester Score):
    #   Score >= fuzzy_assign_min_score UND (gap >= fuzzy_assign_min_gap
    #   oder nur ein Kandidat) -> vorhandenen Korrespondenten direkt zuordnen
    #   sonst Score >= fuzzy_review_min_score -> Stufe 2 mit den (hoechstens
    #     fuzzy_candidate_limit) Kandidaten ab dieser Schwelle - auch bei
    #     mittelmaessigem Score mit grossem Abstand, der wird NIE allein
    #     wegen des Abstands direkt zugeordnet
    #   sonst (Score zu niedrig) -> nichts zuordnen
    # Bewusst Beispiel-Startwerte, noch nicht an einer groesseren
    # Dokument-Stichprobe kalibriert. Ein hoher Score allein beweist keine
    # Identitaet (z.B. "Allianz Versicherung" vs. "Allianz
    # Lebensversicherung" sind verschiedene Rechtstraeger) - im Zweifel
    # lieber nicht zuordnen als falsch.
    fuzzy_assign_min_score: 95.0
    fuzzy_assign_min_gap: 8.0
    fuzzy_review_min_score: 80.0
    fuzzy_candidate_limit: 5

    preprocessing:
      max_input_chars: 8000

    postprocessing:
      strip_quotes: true
      max_length: 200

  # Erstellungsdatum (Paperless "created") aus dem OCR-Text bestimmen.
  # Kurze Dokumente werden einmal komplett analysiert, lange zuerst am
  # Anfang und nur bei unsicherem Ergebnis zusaetzlich am Ende (das
  # massgebliche Datum steht z.B. neben einer Unterschrift). Antworten
  # werden im Code geprueft (gueltiges Kalenderdatum, nicht in der
  # Zukunft, nicht vor 1900), siehe _process_date_step.
  document_date:
    source_field: content
    target_field: created

    # Prompt fuer Abschnitte langer Dokumente (Antwort: DD.MM.JJJJ|SCORE).
    # Bekommt correspondent_name/document_type_name als Kontext - daher
    # nach document_type und correspondent in pipeline:.
    prompt: create-date-part.j2
    model: "mistral-small-3.2-24b-instruct-2506"

    date:
      # Texte bis small_max_chars Zeichen: einmal komplett mit diesem
      # Prompt (Antwort: nur DD.MM.JJJJ, ohne Score) - ein gueltiges
      # Datum wird direkt uebernommen.
      prompt_small: create-date-small.j2
      small_max_chars: 8000
      # Laengere Texte: zuerst die ersten, bei Score < min_score
      # zusaetzlich die letzten part_chars Zeichen; das gueltige Datum
      # mit dem hoechsten Score gewinnt.
      part_chars: 6000
      # Liegt der beste Score darunter, wird das Datum nur gesetzt, wenn
      # das Feld noch leer ist - ein vorhandenes Datum wird nie durch eine
      # unsichere Schaetzung ueberschrieben.
      min_score: 85

    postprocessing:
      strip_quotes: true
      max_length: 50

  title:
    # Paperless-Feld, das als Eingabetext fuer den Prompt gelesen wird.
    source_field: content
    # Paperless-Feld, das mit dem Ergebnis beschrieben wird.
    target_field: title

    prompt: title.j2
    model: "qwen3:4b-instruct"

    preprocessing:
      # Laengerer Eingabetext wird vor dem Rendern des Prompts auf so
      # viele Zeichen gekuerzt.
      max_input_chars: 8000

    postprocessing:
      # Anfuehrungszeichen am Rand der Modellantwort entfernen.
      strip_quotes: true
      # Zur Sicherheit auf maximal so viele Zeichen kuerzen, falls sich
      # das Modell nicht an die Laengenvorgabe im Prompt haelt.
      max_length: 120

  # Dokument als von ArchivLotse bearbeitet markieren (kein KI-Aufruf).
  # Der Tag muss in Paperless bereits existieren - ArchivLotse legt keine
  # Tags selbst an. Steht als letzter Schritt in pipeline: und wird dort
  # nur ausgefuehrt, wenn kein frueherer Schritt dieses Laufs
  # fehlgeschlagen ist (requires_previous_success). Der Batch-Job "todo"
  # (config/batch.yaml) schliesst so markierte Dokumente beim naechsten
  # Lauf aus.
  mark_done:
    target_field: tags
    add_tags:
      - archivlotse-done
    requires_previous_success: true
